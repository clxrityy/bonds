name: Docs Check

on:
  pull_request:
    branches: [master]
    paths:
      - "crates/core/**"
      - "docs/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-*.yml"
  push:
    branches: [master]
    paths:
      - "crates/core/**"
      - "docs/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-*.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "strict or fast"
        required: true
        default: "strict"
        type: choice
        options: [strict, fast]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOCS_PROFILE: ${{ inputs.profile || 'strict' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: ${{ runner.os == 'Linux' && matrix.step != 'fmt' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \

      - name: Build API docs (strict optionally)
        env:
          # In strict mode, rustdoc warnings fail the build.
          RUSTDOCFLAGS: ${{ env.DOCS_PROFILE == 'strict' && '-D warnings' || '' }}
        run: cargo doc --workspace --no-deps

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build guide docs
        # --strict fails on nav/link/reference warnings inside MkDocs.
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Stage API docs for link checking
        run: |
          mkdir -p docs/site/api
          cp -R target/doc/* docs/site/api/
          cat > docs/site/api/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Bonds API Docs</title>
            </head>
            <body>
              <h1>Bonds API Docs</h1>
              <ul>
                <li><a href="./bonds_core/">core</a></li>
                <li><a href="./bonds_cli/">cli</a></li>
                <li><a href="./bond/">bond (binary)</a></li>
              </ul>
            </body>
          </html>
          HTML

      - name: Link-check generated HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --config lychee.toml docs/site/**/*.html
          failIfEmpty: false