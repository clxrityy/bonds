site_name: Bonds
site_description: Bonds is a tool for creating and managing symbolic links between files and directories, enabling flexible organization and access patterns.
# Default points to latest; workflows can override per build context.
site_url: !ENV SITE_URL
repo_url: https://github.com/clxrityy/bonds
repo_name: clxrityy/bonds
edit_uri: edit/master/docs/content/
site_author: MJ Anglin


docs_dir: content

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/img/logo.svg
  favicon: assets/meta/favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

  # Tune palette to your brand as needed
  palette:
    - scheme: slate
      primary: indigo grey
      accent: blue grey
      toggle:
        icon: material/invert-colors-off
        name: Switch to default mode
    - scheme: default
      primary: teal grey
      accent: blue grey
      toggle:
        icon: material/invert-colors
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      use_pygments: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - assets/javascripts/extra.js

nav:
  - Home: index.md
  - CLI: cli.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Library:
      - Overview: library/index.md
      - Events: library/events.md
      - Querying: library/querying.md
      - API Reference:
          - bonds-core: library/core-api.md
          - bonds-cli: library/cli-api.md
  - Contributing:
      - Overview: contributing/index.md
      - Development Workflow: contributing/development.md
      - Testing: contributing/testing.md
      - Pull Requests: contributing/pull-requests.md
      - Reporting Issues: contributing/issues.md
  - Resources:
      - License: resources/license.md
      - Security Policy: resources/security.md
      - Code of Conduct: resources/code-of-conduct.md

copyright: "Copyright © 2026 MJ Anglin. All rights reserved."